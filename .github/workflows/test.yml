name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install flake8 && python -m flake8 . --select=E9,F63,F7,F82,F401,F841 --count --show-source
      - run: node --check app.js && node --check ics.js && node --check sun.js && node --check teams.js && node --check celebrate.js && node --check demo.js
      - run: python -W error::ResourceWarning -m unittest discover -s tests
